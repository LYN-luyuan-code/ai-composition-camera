name: Build and publish Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.1.0'
      - name: Configure permanent release signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: python
        run: |
          import base64, os
          from pathlib import Path
          for key in ('KEYSTORE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD'):
              if not os.environ.get(key): raise SystemExit(f'Missing signing secret: {key}')
          keyfile = Path(os.environ['RUNNER_TEMP']) / 'camera-release.jks'
          keyfile.write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          keyfile.chmod(0o600)
          config = Path('signing.properties')
          config.write_text(f'storeFile={keyfile}\nstorePassword={os.environ["STORE_PASSWORD"]}\nkeyAlias={os.environ["KEY_ALIAS"]}\nkeyPassword={os.environ["KEY_PASSWORD"]}\n')
          config.chmod(0o600)
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug lintRelease assembleRelease
      - name: Package and verify signature
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python3 scripts/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: output/releases/*/*
      - name: Publish versioned APK and checksum
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" output/releases/*/* --verify-tag --title "AI构图相机 $GITHUB_REF_NAME" --generate-notes
      - name: Remove temporary signing material
        if: always()
        run: rm -f signing.properties "$RUNNER_TEMP/camera-release.jks"
